name: Newman Contract Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  newman:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint OpenAPI contracts
        run: npm run lint:contracts

      - name: Start Prism mock server
        run: nohup npm run mock:vision > prism.log 2>&1 &

      - name: Wait for mock server
        run: npx wait-on http-get://localhost:4010/health --timeout 30000

      - name: Run Newman contract tests
        run: npm run test:mock

      - name: Export lint report
        if: always()
        run: npx spectral lint openapi.yaml --fail-severity error > reports/contract-lint-report.txt

      - name: Show Prism log on failure
        if: failure()
        run: cat prism.log || true

      - name: Upload Newman reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-reports
          path: reports/
